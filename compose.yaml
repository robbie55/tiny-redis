# Long-lived dev container: `./scripts/dev.sh` execs into it rather than starting a new
# container per command, so a build costs no container-start latency and the server can
# stay running while you poke it with redis-cli from another shell.
services:
  dev:
    build: .
    image: tiny-redis-dev
    container_name: tiny-redis-dev
    init: true
    working_dir: /work
    ports:
      # Only reachable from the host if the server binds 0.0.0.0 instead of the default
      # 127.0.0.1, because inside a container loopback is the container's own. For
      # benchmarks, run the client inside the container and leave this alone.
      - "127.0.0.1:6380:6380"
    volumes:
      - .:/work
      # build/ is a named volume, not part of the bind mount. Otherwise the macOS and
      # Linux CMakeCaches fight over build/<preset>, and object files on VirtioFS make
      # compiles much slower on Docker Desktop.
      - build:/work/build
      - ccache:/root/.ccache
    command: ["sleep", "infinity"]

volumes:
  build:
  ccache:
